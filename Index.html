<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor 3D</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; }

#loading {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: #ddd; font-family: sans-serif; font-size: 16px;
  text-align: center; pointer-events: none; z-index: 10;
}

/* ── Panel superior derecho ── */
#panel-derecho {
  position: absolute; top: 16px; right: 16px;
  background: rgba(15,15,15,0.88);
  backdrop-filter: blur(8px);
  color: #ccc; font-family: 'Segoe UI', sans-serif; font-size: 12px;
  padding: 16px; border-radius: 12px; width: 180px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  z-index: 20;
}
#panel-derecho h3 {
  margin: 0 0 8px 0; font-size: 11px; color: #888;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px;
}
#panel-derecho label {
  display: block; margin-top: 8px; margin-bottom: 4px;
  color: #aaa; font-size: 11px;
}
#panel-derecho input[type="range"] {
  width: 100%; accent-color: #fff; height: 3px; cursor: pointer;
}

/* ── Panel de selección (esquina inferior izquierda) ── */
#panel-seleccion {
  position: absolute;
  bottom: 24px; left: 24px;
  background: rgba(12,12,12,0.88);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px;
  width: 340px;
  color: #ddd;
  font-family: 'Segoe UI', sans-serif;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  z-index: 20;
  display: none;
  animation: fadeSlideUp 0.22s ease;
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

#btn-cerrar {
  position: absolute; top: 10px; right: 12px;
  background: none; border: none;
  color: #555; font-size: 18px;
  cursor: pointer; line-height: 1; padding: 0;
}
#btn-cerrar:hover { color: #fff; }

/* Navegador de imagen */
#nav-imagen {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  overflow: hidden;   /* ← evita desbordamiento del contenedor */
}
#panel-img {
  flex: 1;
  min-width: 0;        /* ← clave: permite que flex encoja la imagen */
  width: 0;            /* ← fuerza que el flex determine el ancho real */
  height: 120px;       /* ← un poco menos alto para que respire */
  object-fit: cover; border-radius: 10px;
  background: #222;
  display: block;
}
.flecha {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  color: #ccc; font-size: 22px;
  width: 34px; height: 34px;
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
  padding: 0;
}
.flecha:hover { background: rgba(255,255,255,0.18); color: #fff; }
.flecha:disabled { opacity: 0.25; cursor: default; }

#panel-nombre {
  font-size: 14px; font-weight: 600; color: #eee; margin-bottom: 4px;
}
#panel-variante {
  font-size: 11px; color: #666;
}

/* Tooltip de ayuda */
#hint {
  position: absolute; bottom: 24px; right: 24px;
  color: #555; font-family: 'Segoe UI', sans-serif; font-size: 11px;
  pointer-events: none; z-index: 5;
}

/* Highlight de hover sobre objetos seleccionables */
canvas { cursor: default; }
canvas.hoverable { cursor: pointer; }
</style>
</head>
<body>

<div id="loading">Cargando modelo…</div>

<!-- Panel superior derecho -->
<div id="panel-derecho">
  <h3>Luz Global</h3>
  <label>Intensidad</label>
  <input type="range" id="global-intensidad" min="0" max="5" step="0.05" value="1">
</div>

<!-- Panel de selección -->
<div id="panel-seleccion">
  <button id="btn-cerrar" title="Cerrar">✕</button>
  <div id="nav-imagen">
    <button class="flecha" id="flecha-izq">‹</button>
    <img id="panel-img" src="" alt="Variante" />
    <button class="flecha" id="flecha-der">›</button>
  </div>
  <div id="panel-nombre">—</div>
  <div id="panel-variante">—</div>
</div>

<div id="hint">Haz clic en un objeto para ver variantes</div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ── Renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.physicallyCorrectLights = true;
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.toneMapping     = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.3;
renderer.domElement.style.touchAction = 'none';
document.body.appendChild(renderer.domElement);

// ── Escena ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b2b);

// Entorno PMREM
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment()).texture;
pmrem.dispose();

// ── Cámara ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(4, 3, 6);

// ── Controles ────────────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan     = false;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.minAzimuthAngle = -Math.PI / 20;
controls.maxAzimuthAngle =  Math.PI / 2;
controls.maxPolarAngle   =  Math.PI / 2 - 0.05;
controls.minPolarAngle   =  0.7;

// ── Iluminación ──────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
const hemiLight    = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(ambientLight, hemiLight);

document.getElementById('global-intensidad').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  ambientLight.intensity       = v * 0.15;
  hemiLight.intensity          = v * 0.2;
  renderer.toneMappingExposure = 0.3 + v * 0.18;
});

// ── Loaders ───────────────────────────────────────────────────────────────────
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');

const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// ── Estado de selección ───────────────────────────────────────────────────────
let objetoActivo  = null;
let varianteIdx   = 0;        // ← esta línea faltaba
let meshOriginal  = null;
let modeloCargado = null;
const estadoVariantes = {}; // { 'SofaL_GEO': { idx: 2, modelo: <Object3D|null> }, ... }  // GLB externo en escena

// ── UI ────────────────────────────────────────────────────────────────────────
const panel    = document.getElementById('panel-seleccion');
const panelImg = document.getElementById('panel-img');
const panelNom = document.getElementById('panel-nombre');
const panelVar = document.getElementById('panel-variante');
const flechaIzq = document.getElementById('flecha-izq');
const flechaDer = document.getElementById('flecha-der');

function actualizarUI() {
  const item = CATALOGO[objetoActivo];
  const v    = item.variantes[varianteIdx];
  panelImg.src         = v.img;
  panelNom.textContent = v.nombre || item.nombre;   // ← variante primero, fallback al padre
  panelVar.textContent = `${v.label}  ·  ${varianteIdx + 1} / ${item.variantes.length}`;
  flechaIzq.disabled   = item.variantes.length <= 1;
  flechaDer.disabled   = item.variantes.length <= 1;
}

function mostrarPanel() {
  // Re-trigger animation
  panel.style.display = 'none';
  // Force reflow
  void panel.offsetWidth;
  panel.style.display = 'block';
}

function cerrarPanel() {
  panel.style.display = 'none';
}

// Botón cerrar
document.getElementById('btn-cerrar').addEventListener('click', (e) => {
  e.stopPropagation();
  cerrarPanel();
});

panel.addEventListener('pointerdown', (e) => { 
  clickEnCanvas = false; 
  e.stopPropagation(); 
});
panel.addEventListener('pointerup', (e) => e.stopPropagation());

document.getElementById('panel-derecho').addEventListener('pointerdown', (e) => { 
  clickEnCanvas = false; 
  e.stopPropagation(); 
});
document.getElementById('panel-derecho').addEventListener('pointerup', (e) => e.stopPropagation());

// ── Carga de variante ─────────────────────────────────────────────────────────
function cargarVariante() {
  const item = CATALOGO[objetoActivo];
  const v    = item.variantes[varianteIdx];

  if (modeloCargado) {
    scene.remove(modeloCargado);
    modeloCargado = null;
  }

if (v.glb === null) {
  if (meshOriginal) meshOriginal.visible = true;
  estadoVariantes[objetoActivo] = { idx: 0, modelo: null };
  return;
}

  if (!meshOriginal) return;

  // ── 1. Capturar posición ANTES de tocar visibilidad ──
  meshOriginal.visible = true; // asegurar que está visible para el bbox
  const boxOrig    = new THREE.Box3().setFromObject(meshOriginal);
  const centerOrig = new THREE.Vector3();
  boxOrig.getCenter(centerOrig);
  const pisoOrig   = boxOrig.min.y;

  // ── 2. Ocultar DESPUÉS ──
  meshOriginal.visible = false;

  gltfLoader.load(
    v.glb,
    (gltf) => {
      modeloCargado = gltf.scene;
      scene.add(modeloCargado);

      const boxNuevo    = new THREE.Box3().setFromObject(modeloCargado);
      const centerNuevo = new THREE.Vector3();
      boxNuevo.getCenter(centerNuevo);
      const pisoNuevo   = boxNuevo.min.y;

      modeloCargado.position.x += centerOrig.x - centerNuevo.x;
      modeloCargado.position.y += pisoOrig     - pisoNuevo;
      modeloCargado.position.z += centerOrig.z - centerNuevo.z;

// Al final del callback de gltfLoader, después del traverse:
modeloCargado.traverse((node) => {
  node.userData.catalogKey = objetoActivo;
});

// Guardar estado
estadoVariantes[objetoActivo] = { idx: varianteIdx, modelo: modeloCargado };
    },
    null,
    (err) => console.error('[Variante] Error:', v.glb, err)
  );
}

// Flechas
flechaDer.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!objetoActivo) return;
  const item = CATALOGO[objetoActivo];
  varianteIdx = (varianteIdx + 1) % item.variantes.length;
  estadoVariantes[objetoActivo] = { idx: varianteIdx, modelo: modeloCargado };
  actualizarUI();
  cargarVariante();
});

flechaIzq.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!objetoActivo) return;
  const item = CATALOGO[objetoActivo];
  varianteIdx = (varianteIdx - 1 + item.variantes.length) % item.variantes.length;
  estadoVariantes[objetoActivo] = { idx: varianteIdx, modelo: modeloCargado };
  actualizarUI();
  cargarVariante();
});

// ── Raycast ───────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

/**
 * Dado un objeto Three.js, sube la cadena de padres buscando
 * alguno cuyo .name esté en el catálogo. Retorna la clave o null.
 */
function buscarEnCatalogo(obj) {
  let node = obj;
  while (node) {
    if (CATALOGO[node.name]) return node.name;
    if (node.userData.catalogKey) return node.userData.catalogKey;
    node = node.parent;
  }
  return null;
}

function abrirPorNombre(nombreMesh) {
  const item = CATALOGO[nombreMesh];
  if (!item) return;

  if (objetoActivo === nombreMesh) {
    actualizarUI();
    mostrarPanel();
    return;
  }

  // Guardar referencia del modelo externo anterior (no lo removemos)
  // Solo soltamos la referencia activa
  modeloCargado = null;
  meshOriginal  = null;

  // Restaurar varianteIdx del objeto nuevo desde su estado guardado
  objetoActivo = nombreMesh;
  varianteIdx  = estadoVariantes[nombreMesh]?.idx ?? 0;

  // Buscar nodo original en la escena
  scene.traverse((node) => {
    if (node.name === nombreMesh) meshOriginal = node;
  });

  // Recuperar modelo externo guardado para este objeto (si tenía uno)
  modeloCargado = estadoVariantes[nombreMesh]?.modelo ?? null;

  actualizarUI();
  mostrarPanel();
}

// ── Detectar click vs drag ────────────────────────────────────────────────────
let pointerStart    = { x: 0, y: 0 };
let isDragging      = false;
let pointerDownTime = 0;

function getCanvasXY(e) {
  // Unifica mouse y touch
  if (e.touches && e.touches.length > 0) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

let clickEnCanvas = false;

renderer.domElement.addEventListener('pointerdown', (e) => {
  clickEnCanvas   = true;
  pointerDownTime = Date.now();
  const p = getCanvasXY(e);
  pointerStart = { x: p.x, y: p.y };
  isDragging   = false;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  const p = getCanvasXY(e);
  if (Math.abs(p.x - pointerStart.x) > 12 || Math.abs(p.y - pointerStart.y) > 12) {
    isDragging = true;
  }

  // Hover: cambia cursor si hay algo seleccionable
  mouse.x =  (p.x / window.innerWidth)  * 2 - 1;
  mouse.y = -(p.y / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  let hoverable = false;
  for (const hit of hits) {
    if (buscarEnCatalogo(hit.object)) { hoverable = true; break; }
  }
  renderer.domElement.style.cursor = hoverable ? 'pointer' : 'default';
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const elapsed = Date.now() - pointerDownTime;
  const p       = getCanvasXY(e);
  const moved   = Math.hypot(p.x - pointerStart.x, p.y - pointerStart.y);

  if (isDragging || moved > 12 || elapsed > 400) return;
  if (!clickEnCanvas) return;
  clickEnCanvas = false;

  mouse.x =  (p.x / window.innerWidth)  * 2 - 1;
  mouse.y = -(p.y / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(scene.children, true);

  if (hits.length === 0) { cerrarPanel(); return; }

  const clave = buscarEnCatalogo(hits[0].object);
  if (clave) {
    abrirPorNombre(clave);
  } else {
    cerrarPanel();
  }
});

// ── Cargar Room.glb ───────────────────────────────────────────────────────────
gltfLoader.load(
  'Models/Room_004.glb',
  (gltf) => {
    const root = gltf.scene;
    scene.add(root);

    // Log de todos los nodos para debug
    console.log('=== Nodos del GLB ===');
    root.traverse((n) => {
      if (n.name) console.log(n.type, '→', n.name);
    });

    // Ajustar cámara y controles al bounding box
    const box    = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    controls.target.copy(center);
    controls.minDistance = maxDim * 1.6;
    controls.maxDistance = maxDim * 2.0;

    camera.near = maxDim / 20;
    camera.far  = maxDim * 4;
    camera.position.set(
      center.x + maxDim * 0.8,
      center.y + maxDim * 0.5,
      center.z + maxDim * 0.8
    );
    camera.updateProjectionMatrix();
    controls.update();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('hint').style.display    = 'block';
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      document.getElementById('loading').textContent = `Cargando modelo… ${pct}%`;
    }
  },
  (err) => {
    console.error('[Room] Error:', err);
    document.getElementById('loading').textContent =
      'Error al cargar el modelo. Verifica la ruta Models/Room_004.glb y usa un servidor local.';
  }
);

// ── Loop de render ────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// ── Responsive ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
